<!doctype html><html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#FFD21F">
<title>AnuncioFácil · todoshop</title>
<style>
:root{--bg:#f6f6f4;--card:#fff;--tx:#161616;--mut:#666;--bd:#e4e4e0;--ac:#FFD21F}
@media(prefers-color-scheme:dark){:root{--bg:#121212;--card:#1c1c1c;--tx:#f2f2f2;--mut:#aaa;--bd:#333}}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--tx);font:15px/1.4 Roboto,Arial,sans-serif;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
header{background:var(--ac);color:#161616;padding:14px 16px;font-weight:900;font-size:18px}header small{font-weight:500;display:block;font-size:12px}
main{max-width:640px;margin:auto;padding:12px;display:grid;gap:12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px}
canvas{width:100%;height:auto;border-radius:10px;border:1px solid var(--bd);display:block;background:#fff}
label{display:block;font-weight:700;font-size:12px;margin:12px 0 4px;text-transform:uppercase}
.ck{display:flex;gap:8px;align-items:center;text-transform:none;font-size:14px;font-weight:600}.ck input{width:auto}
input,select,textarea{width:100%;padding:12px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit}
.btn{border:0;background:var(--ac);color:#161616;font:900 15px Roboto,Arial,sans-serif;padding:14px;border-radius:10px;width:100%}
.btn.sec{background:transparent;border:2px solid var(--ac);color:var(--tx)}.btn:active{filter:brightness(.92)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}.hide{display:none}
#msg{min-height:22px;margin-top:8px;font-weight:600;font-size:13px}small.h{color:var(--mut);display:block;margin-top:3px}
details summary{font-weight:700;cursor:pointer}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>
<header>🛒 AnuncioFácil<small>todoshop · anuncios listos para publicar</small></header>
<main>
<section class="card"><canvas id="cv" width="1080" height="1080"></canvas><div id="msg" role="status"></div>
<div class="row"><button class="btn" id="share">📤 Compartir / Guardar</button><button class="btn sec" id="dl">⬇ Descargar</button></div></section>
<section class="card">
<label for="fmt">Formato</label><select id="fmt"><option value="cuadrado">Cuadrado 1080×1080</option><option value="vertical">Vertical 1080×1350</option><option value="horizontal">Horizontal 1920×1080</option></select>
<label for="style">Estilo</label><select id="style"><option value="detalles">Con detalles</option><option value="minimal">Minimalista</option></select>
<label for="variant">Tipo de anuncio</label><select id="variant"><option value="nuevo">Producto nuevo</option><option value="oferta">Oferta</option><option value="catalogo">Catálogo</option></select>
<label for="img">Foto del producto</label><input type="file" id="img" accept="image/*">
<label class="ck"><input type="checkbox" id="enh" checked> Mejorar calidad y resolución</label>
<label class="ck"><input type="checkbox" id="cut"> Quitar fondo (fondos lisos)</label>
<div id="gTol" class="hide"><label for="tol">Sensibilidad del recorte</label><input type="range" id="tol" min="15" max="90" value="45"><small class="h">Si queda fondo, sube; si se come el producto, baja. Funciona mejor con fondo liso. En PC el recorte es con IA.</small></div>
<label for="name">Nombre del producto</label><input id="name" maxlength="70" value="Nombre del producto">
<label for="price">Precio o promoción</label><input id="price" maxlength="20" value="$00.00">
<div id="gOld" class="hide"><label for="old">Precio anterior (tachado)</label><input id="old" maxlength="20" value="$00.00"><label for="offer">Etiqueta</label><input id="offer" maxlength="24" value="OFERTA ESPECIAL"></div>
<label for="feat">Características (una por línea, máx. 4)</label><textarea id="feat" rows="4"></textarea>
<label for="cta">Llamado a la acción</label><input id="cta" list="ctas" maxlength="34" value="Escríbenos por WhatsApp"><datalist id="ctas"><option value="Consulta disponibilidad"><option value="Pide el tuyo hoy"><option value="Escríbenos por WhatsApp"></datalist>
<label for="phone">WhatsApp / contacto</label><input id="phone" maxlength="24" inputmode="tel" placeholder="+00 000 000 000">
<div id="gPage" class="hide"><label for="page">Página del catálogo</label><input id="page" maxlength="10" value="1 de 20"></div>
</section>
<section class="card"><details><summary>Respaldo de ajustes</summary>
<small class="h">Copia el texto para guardarlo o pégalo para restaurar tus textos. Las fotos no se guardan.</small>
<textarea id="bk" rows="4"></textarea><div class="row"><button class="btn sec" id="bkc">Copiar</button><button class="btn sec" id="bki">Importar</button></div></details>
<button class="btn sec" id="clr" style="margin-top:12px">Limpiar todo</button></section>
</main>
