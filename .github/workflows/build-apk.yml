name: Compilar EXE

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pyinstaller
      - run: pyinstaller --noconfirm --onefile --windowed --name AnuncioFacil --collect-all onnxruntime --add-data "logo.png;." --add-data "fonts;fonts" --add-data "models;models" app.py
      - uses: actions/upload-artifact@v6
        with:
          name: AnuncioFacil-exe
          path: dist/AnuncioFacil.exe
